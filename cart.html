<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>MiniMart - Giỏ Hàng</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/cart.css">
</head>
<body>
    <header>
        <div class="logo">🛒 MiniMart</div>
        <nav>
            <a href="index.html">Trang chủ</a>
            <a href="products.html">Sản phẩm</a>
            <a href="product-detail.html?id=sua">Chi tiết</a>
            <a href="cart.html">Giỏ hàng</a>
            <a href="member.html">Hội viên & Ưu đãi</a>
        </nav>
    </header>

    <div class="container">
        <h2>Giỏ hàng của bạn</h2>
        <table>
            <thead>
                <tr>
                    <th>Hình ảnh</th>
                    <th>Sản phẩm</th>
                    <th>Đơn giá</th>
                    <th>Số lượng</th>
                    <th>Thành tiền</th>
                    <th>Thao tác</th>
                </tr>
            </thead>
            <tbody id="cart-row">
                <!-- Dữ liệu sản phẩm thực tế được nạp động vào đây -->
            </tbody>
        </table>

        <h3 style="margin-bottom: 25px;">Tổng thanh toán: <span id="tongtien" style="color: #d9534f;">0 đ</span></h3>

        <div class="checkout-form">
            <h3>Thông tin nhận hàng</h3>
            <input type="text" id="ten" placeholder="Họ và tên người nhận">
            <input type="text" id="sdt" placeholder="Số điện thoại (10 chữ số)">
            <input type="text" id="diachi" placeholder="Địa chỉ giao hàng">
            <button class="btn" style="width: 100%; padding: 12px; font-size: 1.1rem;" onclick="datHang()">Xác nhận đặt hàng</button>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 MiniMart. Đồ án Thiết kế Web.</p>
    </footer>

    <script src="js/cart.js"></script>
</body>
</html>
