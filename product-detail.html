<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>MiniMart - Chi Tiết Sản Phẩm</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/detail.css">
</head>
<body>
    <header>
        <div class="logo">🛒 MiniMart</div>
        <nav>
            <a href="index.html">Trang chủ</a>
            <a href="products.html">Sản phẩm</a>
            <a href="product-detail.html?id=sua">Chi tiết</a>
            <a href="cart.html">Giỏ hàng</a>
            <a href="member.html">Hội viên & Ưu đãi</a>
        </nav>
    </header>

    <div class="container">
        <div class="detail-box">
            <img id="prod-img" src="" alt="Hình sản phẩm">
            <div class="info">
                <h2 id="prod-name">Đang tải tên sản phẩm...</h2>
                <p class="price" id="prod-price">0 đ</p>
                <p><strong>Tình trạng:</strong> Còn hàng (Tồn kho: <span id="prod-stock">0</span>)</p>
                <p id="prod-desc" style="margin-top: 15px;"></p>
                
                <div class="quantity-control">
                    <span>Số lượng:</span>
                    <button onclick="doiSL(-1)">-</button>
                    <span id="sl">1</span>
                    <button onclick="doiSL(1)">+</button>
                </div>

                <button class="btn" onclick="themGio()">Thêm vào giỏ hàng</button>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 MiniMart.Thiết kế Web.</p>
    </footer>

    <script src="js/detail.js"></script>
</body>
</html>
